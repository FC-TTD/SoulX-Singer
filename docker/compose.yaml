name: soulx-singer

services:
  soulx-singer:
    image: soulx-singer:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: soulx-singer
    restart: unless-stopped
    shm_size: "16gb"
    ports:
      - "30931:30931"
    environment:
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      CUDA_VISIBLE_DEVICES: "${CUDA_VISIBLE_DEVICES:-0}"
      HF_ENDPOINT: "${HF_ENDPOINT:-https://huggingface.co}"
      HF_HOME: "/data/hf"
      HF_HUB_CACHE: "/data/hf/hub"
      TRANSFORMERS_CACHE: "/data/hf/hub"
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_SERVER_PORT: "30931"
      SOULX_PRETRAINED_ROOT: "/data/pretrained_models"
      NUMBA_CACHE_DIR: "/tmp/numba-cache"
    volumes:
      - hf-cache:/data/hf
      - pretrained-models:/data/pretrained_models
      - outputs:/app/outputs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:30931/health', timeout=5).read()\""]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    working_dir: /app

volumes:
  hf-cache:
  pretrained-models:
  outputs:
